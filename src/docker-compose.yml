services:
  fronted:
    build: ./fronted
    container_name: fronted
    depends_on:
      - backend
    networks:
      - transcendance

  backend:
    build: ./backend
    container_name: backend
    networks:
      - transcendance

  database:
    build: ./database
    container_name: database
    networks:
      - transcendance

networks:
  transcendance:
    driver: bridge